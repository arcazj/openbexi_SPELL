worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_host $local_session_host {
        default 0;
        ~^(127[.]0[.]0[.]1|localhost):[0-9]+$ 1;
    }
    limit_req_zone $binary_remote_addr zone=local_session:1m rate=5r/s;

    server {
        listen 8080;
        server_name localhost 127.0.0.1;
        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/security_headers.conf;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Spell-Local-Ingress "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location = /api/v1/local-session {
            # Only the published loopback browser origin may bootstrap. Never
            # trust an incoming marker or proxy-supplied actor/role identity.
            if ($local_session_host = 0) { return 403; }
            set $local_session_origin "$scheme://$http_host";
            if ($http_origin != $local_session_origin) { return 403; }
            limit_req zone=local_session burst=10 nodelay;
            client_max_body_size 32;
            access_log off;
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Spell-Local-Ingress "loopback-proxy-v16";
            proxy_set_header Connection "";
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }

        location /assets/ {
            include /etc/nginx/security_headers.conf;
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            include /etc/nginx/security_headers.conf;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store";
        }
    }
}
