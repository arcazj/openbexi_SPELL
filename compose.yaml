services:
  # Simulator-only local ingress. This stack is not a production deployment.
  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    ports:
      - "127.0.0.1:${SPELL_PROXY_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - spell-edge
      - spell-internal

  backend:
    image: openbexi-spell-backend:${SPELL_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://spell:${SPELL_DB_PASSWORD:?Set SPELL_DB_PASSWORD in .env}@postgres:5432/spell
      SPELL_JWT_ISSUER: ${SPELL_JWT_ISSUER:-openbexi-spell-local}
      SPELL_JWT_AUDIENCE: ${SPELL_JWT_AUDIENCE:-openbexi-spell-api}
      SPELL_JWT_HS256_SECRET: ${SPELL_JWT_HS256_SECRET:?Set a 32-byte SPELL_JWT_HS256_SECRET in .env}
      SPELL_JWT_MAX_LIFETIME_SECONDS: ${SPELL_JWT_MAX_LIFETIME_SECONDS:-900}
      SPELL_JWT_CLOCK_SKEW_SECONDS: ${SPELL_JWT_CLOCK_SKEW_SECONDS:-30}
      SPELL_ALLOW_LOCAL_DEV_TOKEN: ${SPELL_ALLOW_LOCAL_DEV_TOKEN:-false}
      SPELL_LOCAL_SESSION_ENABLED: ${SPELL_LOCAL_SESSION_ENABLED:-true}
      SPELL_LOCAL_SESSION_PORT: ${SPELL_PROXY_PORT:-8080}
      SPELL_WS_REPLAY_LIMIT: ${SPELL_WS_REPLAY_LIMIT:-1000}
      SPELL_WS_QUEUE_SIZE: ${SPELL_WS_QUEUE_SIZE:-256}
      SPELL_WS_KEEPALIVE_SECONDS: ${SPELL_WS_KEEPALIVE_SECONDS:-5}
      SPELL_COMMAND_ACK_TIMEOUT_SECONDS: ${SPELL_COMMAND_ACK_TIMEOUT_SECONDS:-5}
      SPELL_DRIVER_ENABLED: ${SPELL_DRIVER_ENABLED:-true}
      SPELL_DSS_ENABLED: ${SPELL_DSS_ENABLED:-true}
      SPELL_DSS_CORTEX_HOST: dss
      SPELL_DSS_CORTEX_PORT: "3080"
      SPELL_DSS_KAFKA_BOOTSTRAP: kafka:9092
      SPELL_DRIVER_RPC_TIMEOUT_SECONDS: ${SPELL_DRIVER_RPC_TIMEOUT_SECONDS:-2}
      SPELL_DRIVER_POLL_SECONDS: ${SPELL_DRIVER_POLL_SECONDS:-1}
      SPELL_DRIVER_STALE_AFTER_SECONDS: ${SPELL_DRIVER_STALE_AFTER_SECONDS:-5}
      SPELL_OBSERVATION_POLL_SECONDS: ${SPELL_OBSERVATION_POLL_SECONDS:-0.2}
      SPELL_OBSERVATION_FRESHNESS_SWEEP_SECONDS: ${SPELL_OBSERVATION_FRESHNESS_SWEEP_SECONDS:-0.5}
      SPELL_DATA_DIR: /var/lib/openbexi-spell/data
      SPELL_V0007_BACKUP_DIR: /var/lib/openbexi-spell/migration-backups
      SPELL_BUNDLE_REQUEST_DIR: /var/lib/openbexi-spell/builder/requests
      SPELL_BUNDLE_RESPONSE_A_DIR: /var/lib/openbexi-spell/builder/responses-a
      SPELL_BUNDLE_RESPONSE_B_DIR: /var/lib/openbexi-spell/builder/responses-b
      SPELL_BUNDLE_BUILD_TIMEOUT_SECONDS: ${SPELL_BUNDLE_BUILD_TIMEOUT_SECONDS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      pki-init:
        condition: service_completed_successfully
        required: false
      bundle-builder-a:
        condition: service_healthy
      bundle-builder-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/backend/healthcheck.py"]
      interval: 5s
      timeout: 3s
      retries: 12
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      - /run/spell-driver-client:rw,noexec,nosuid,nodev,size=64k,mode=0700,uid=10001,gid=10001
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    volumes:
      - spell-driver-client-credentials:/run/spell-driver-client-source:ro
      - spell-data:/var/lib/openbexi-spell/data
      - spell-migration-backups:/var/lib/openbexi-spell/migration-backups
      - spell-bundle-builder-requests:/var/lib/openbexi-spell/builder/requests
      - spell-bundle-builder-response-a:/var/lib/openbexi-spell/builder/responses-a
      - spell-bundle-builder-response-b:/var/lib/openbexi-spell/builder/responses-b
    networks:
      spell-internal:
        aliases:
          - spell-api
      spell-driver-internal: {}

  bundle-builder-a:
    image: openbexi-spell-backend:${SPELL_IMAGE_TAG:-local}
    entrypoint: ["python", "-m", "backend.development_bundle_worker"]
    command: []
    environment:
      SPELL_BUNDLE_BUILDER_WORKER_ID: builder-a
      SPELL_BUNDLE_REQUEST_DIR: /var/lib/openbexi-spell/builder/requests
      SPELL_BUNDLE_RESPONSE_DIR: /var/lib/openbexi-spell/builder/responses
      SPELL_BUNDLE_BUILDER_POLL_SECONDS: ${SPELL_BUNDLE_BUILDER_POLL_SECONDS:-0.05}
    user: "10001:10001"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 512m
    cpus: "0.50"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "backend.development_bundle_worker", "--healthcheck"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 2s
    volumes:
      - spell-bundle-builder-requests:/var/lib/openbexi-spell/builder/requests:ro
      - spell-bundle-builder-response-a:/var/lib/openbexi-spell/builder/responses

  bundle-builder-b:
    image: openbexi-spell-backend:${SPELL_IMAGE_TAG:-local}
    entrypoint: ["python", "-m", "backend.development_bundle_worker"]
    command: []
    environment:
      SPELL_BUNDLE_BUILDER_WORKER_ID: builder-b
      SPELL_BUNDLE_REQUEST_DIR: /var/lib/openbexi-spell/builder/requests
      SPELL_BUNDLE_RESPONSE_DIR: /var/lib/openbexi-spell/builder/responses
      SPELL_BUNDLE_BUILDER_POLL_SECONDS: ${SPELL_BUNDLE_BUILDER_POLL_SECONDS:-0.05}
    user: "10001:10001"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 512m
    cpus: "0.50"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "backend.development_bundle_worker", "--healthcheck"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 2s
    volumes:
      - spell-bundle-builder-requests:/var/lib/openbexi-spell/builder/requests:ro
      - spell-bundle-builder-response-b:/var/lib/openbexi-spell/builder/responses

  postgres:
    build:
      context: .
      dockerfile: driver_host/postgres.Dockerfile
    user: "70:70"
    environment:
      POSTGRES_DB: spell
      POSTGRES_USER: spell
      POSTGRES_PASSWORD: ${SPELL_DB_PASSWORD:?Set SPELL_DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spell -d spell"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - spell-postgres-data:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    networks:
      - spell-internal

  pki-init:
    build:
      context: .
      dockerfile: driver_host/pki.Dockerfile
    command:
      - --client-dir
      - /run/spell-driver-client-source
      - --server-dir
      - /run/spell-driver-server
      - --client-uid
      - "0"
      - --client-gid
      - "0"
      - --server-uid
      - "10002"
      - --server-gid
      - "10002"
    user: "0:0"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: "0.50"
    restart: "no"
    volumes:
      - spell-driver-client-credentials:/run/spell-driver-client-source
      - spell-driver-server-credentials:/run/spell-driver-server

  spell-driver:
    build:
      context: .
      dockerfile: driver_host/Dockerfile
    depends_on:
      pki-init:
        condition: service_completed_successfully
      dss:
        condition: service_healthy
    environment:
      SPELL_DSS_ENABLED: ${SPELL_DSS_ENABLED:-true}
      SPELL_DSS_CORTEX_HOST: dss
      SPELL_DSS_CORTEX_PORT: "3080"
      SPELL_DSS_KAFKA_BOOTSTRAP: kafka:9092
    user: "10002:10002"
    stop_signal: SIGINT
    stop_grace_period: 2s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -r /run/spell-driver-server/server.key &&
          test -w /var/lib/spell-driver &&
          kill -0 1
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: "1.00"
    volumes:
      - spell-driver-server-credentials:/run/spell-driver-server:ro
      - spell-driver-journal:/var/lib/spell-driver
    networks:
      - spell-driver-internal

  # One local broker. No host listener or connection to a mission network.
  kafka:
    image: openbexi-spell-kafka:${SPELL_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: dss/kafka.Dockerfile
    platform: linux/amd64
    hostname: kafka
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_NUM_NETWORK_THREADS: "2"
      KAFKA_NUM_IO_THREADS: "2"
      KAFKA_BACKGROUND_THREADS: "2"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: "1"
      KAFKA_LOG_RETENTION_BYTES: "67108864"
      KAFKA_LOG_SEGMENT_BYTES: "16777216"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "30000"
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
      KAFKA_JVM_PERFORMANCE_OPTS: -server -XX:+UseG1GC -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms16m -Xmx64m' /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 30s
    mem_limit: 512m
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,uid=1000,gid=1000
      - /opt/kafka/config:size=4m,noexec,nosuid,uid=1000,gid=1000
      - /opt/kafka/logs:size=16m,noexec,nosuid,uid=1000,gid=1000
    cpus: "1.00"
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - spell-dss-kafka:/var/lib/kafka/data
    networks:
      - spell-driver-internal

  dss:
    image: openbexi-spell-dss:${SPELL_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: dss/Dockerfile
    environment:
      DSS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DSS_STATE_PATH: /var/lib/dss/satellite.sqlite
      DSS_LOCAL_PORT: ${SPELL_PROXY_PORT:-8080}
      DSS_TEST_CONTROL_ENABLED: ${DSS_TEST_CONTROL_ENABLED:-false}
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DSS_TC_PORT:-3080}:3080"
    healthcheck:
      test: ["CMD", "python", "-m", "dss.healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 10s
    user: "10003:10003"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    mem_limit: 192m
    cpus: "0.50"
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - spell-dss-state:/var/lib/dss
    networks:
      - spell-driver-internal
      - spell-internal

volumes:
  spell-postgres-data:
  spell-driver-client-credentials:
  spell-driver-server-credentials:
  spell-driver-journal:
  spell-data:
  spell-migration-backups:
  spell-bundle-builder-requests:
  spell-bundle-builder-response-a:
  spell-bundle-builder-response-b:
  spell-dss-kafka:
  spell-dss-state:

networks:
  spell-edge:
  spell-internal:
    internal: true
  spell-driver-internal:
    internal: true
