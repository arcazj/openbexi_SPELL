services:
  # Simulator-only development service. This is not a production deployment.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://spell:spell-dev-only@postgres:5432/spell
      SPELL_DEV_AUTH_TOKEN: spell-dev-token
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - spell-simulator

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: spell
      POSTGRES_USER: spell
      POSTGRES_PASSWORD: spell-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spell -d spell"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - spell-postgres-data:/var/lib/postgresql
    networks:
      - spell-simulator

volumes:
  spell-postgres-data:

networks:
  spell-simulator:
