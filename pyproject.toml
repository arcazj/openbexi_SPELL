[project]
name = "openbexi-spell"
version = "0.3.0"
description = "Simulator-only modernization vertical slice for SPELL"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "OpenBEXI SPELL contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Web Environment",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.spell.supply-chain]
python_input = "backend/requirements.txt"
python_lock = "backend/requirements.hashes.lock"
node_lock = "frontend/package-lock.json"
base_images_are_digest_pinned = true
live_spacecraft_approved = false
